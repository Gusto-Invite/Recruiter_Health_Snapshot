<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invite Recruiting · Hiring at a Glance</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Song+Myung&family=Playfair+Display:wght@800&display=swap" rel="stylesheet">
<style>
:root {
  --coral:  #F45D48;
  --ink:    #222525;
  --ink-60: #6C6C72;
  --ink-20: #EAEAEA;
  --bg:     #F8F5F2;
  --white:  #FFFFFF;
  --teal:   #0A8080;
  --amber:  #D97706;
  --purple: #6B55D6;
  --green:  #10B981;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: hidden; }
body {
  font-family: 'Nunito', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── Page shell ── */
.page { max-width: 1100px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px) 80px; position: relative; z-index: 1; }

/* ── Hero section ── */
.hero-section {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: clamp(24px, 5vw, 60px);
  padding: clamp(40px, 6vw, 72px) 0 clamp(36px, 5vw, 64px);
}

/* Soft blob shapes — fixed to page so they never get clipped */
.blob {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}
.blob-coral {
  width: 600px; height: 520px;
  background: radial-gradient(circle, rgba(244,93,72,.18) 0%, rgba(244,93,72,.05) 55%, transparent 100%);
  top: -140px; right: -160px;
}
.blob-teal {
  width: 480px; height: 420px;
  background: radial-gradient(circle, rgba(10,128,128,.14) 0%, rgba(10,128,128,.04) 55%, transparent 100%);
  top: 240px; left: -100px;
}

/* ── Left hero content ── */
.hero-left { position: relative; z-index: 1; }
.hero-eyebrow {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 800; text-transform: uppercase;
  letter-spacing: 2px; color: var(--coral); margin-bottom: 20px;
}
.hero-eyebrow-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--coral); flex-shrink: 0;
}
.hero-headline {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(38px, 5.2vw, 64px); font-weight: 800; letter-spacing: -1px;
  line-height: 1.05; color: var(--ink); margin-bottom: 20px;
}
.hero-headline .teal { color: var(--teal); }
.hero-sub {
  font-size: 15px; color: var(--ink-60); line-height: 1.7;
  max-width: 440px; font-weight: 600;
}
.hero-sub-line { display: block; }

/* ── Right stats ── */
.hero-stats {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  min-width: 160px; text-align: right; flex-shrink: 0;
}
.hero-stat { padding: 18px 0; }
.hero-stat + .hero-stat { border-top: 1px solid var(--ink-20); }
.hero-stat-val {
  font-size: clamp(36px, 4vw, 52px); font-weight: 900; letter-spacing: -2px;
  line-height: 1; margin-bottom: 4px;
}
.hero-stat-lbl {
  font-size: 10px; font-weight: 800; text-transform: uppercase;
  letter-spacing: 1.8px; color: var(--ink-60);
}

/* ── Divider ── */
.section-divider {
  height: 0; margin-bottom: 40px;
}

/* ── Team grid ── */
.team-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
}
@keyframes cardGlow {
  0%, 100% { box-shadow: 0 0 0 0 var(--tca, rgba(244,93,72,0)); }
  50%       { box-shadow: 0 0 18px 5px var(--tca, rgba(244,93,72,.22)); }
}
.team-card {
  background: color-mix(in srgb, var(--tc, var(--coral)) 7%, transparent);
  border: 1.5px solid var(--tc, var(--coral));
  border-radius: 16px;
  padding: 18px 16px 16px;
  text-decoration: none;
  color: var(--ink);
  display: flex; flex-direction: column;
  animation: cardGlow 3.5s ease-in-out infinite;
  cursor: pointer;
}
.team-card:nth-child(2) { animation-delay: .7s; }
.team-card:nth-child(3) { animation-delay: 1.4s; }
.team-card:nth-child(4) { animation-delay: 2.1s; }
.team-card:nth-child(5) { animation-delay: 2.8s; }
.team-card:hover {
  animation: none;
  transform: translateY(-3px);
  box-shadow: 0 0 28px 8px var(--tca, rgba(244,93,72,.32));
  border-width: 2px;
  transition: transform .18s, box-shadow .18s, border-width .18s;
}
.team-card-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.team-arrow {
  font-size: 13px; color: var(--tc, var(--coral)); font-weight: 700;
  opacity: .5; transition: opacity .15s, transform .15s;
}
.team-card:hover .team-arrow { opacity: 1; transform: translateX(3px); }
.team-name {
  font-size: 9px; font-weight: 800; letter-spacing: 2px;
  text-transform: uppercase; color: var(--tc, var(--coral));
  margin-bottom: 6px;
}
.team-oar {
  font-size: 32px; font-weight: 900; letter-spacing: -1.5px;
  line-height: 1; color: var(--ink);
  margin-bottom: 4px;
}
.team-oar-lbl {
  font-size: 10px; font-weight: 700; color: var(--ink-60);
  text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 10px;
}
.team-bar-wrap {
  height: 2px; background: var(--ink-20); border-radius: 1px;
  overflow: hidden; margin-bottom: 8px;
}
.team-bar { height: 100%; border-radius: 1px; background: var(--tc, var(--coral)); transition: width .4s; }
.team-reqs {
  font-size: 10px; color: var(--ink-60); font-weight: 600; margin-top: auto;
}

/* ── Card throw overlay ── */
#card-throw-ov {
  display: none;
  position: fixed;
  z-index: 9999;
  overflow: hidden;
  pointer-events: none;
  will-change: transform;
}

/* ── Responsive ── */
@media (max-width: 860px) {
  .hero-section { grid-template-columns: 1fr; gap: 32px; }
  .hero-stats { text-align: left; flex-direction: row; gap: 0; flex-wrap: wrap; }
  .hero-stat { flex: 1; min-width: 120px; padding: 16px 20px 16px 0; }
  .hero-stat + .hero-stat {
    border-top: none;
    border-left: 1px solid var(--ink-20);
    padding-left: 20px;
  }
  .team-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 560px) {
  .team-grid { grid-template-columns: 1fr 1fr; }
  .hero-stats { flex-direction: column; }
  .hero-stat { padding: 12px 0; }
  .hero-stat + .hero-stat { border-left: none; border-top: 1px solid var(--ink-20); padding-left: 0; }
}
</style>
</head>
<body>
<div class="page">
  <!-- Hero -->
  <div class="hero-section">
    <!-- Background blobs -->
    <div class="blob blob-coral"></div>
    <div class="blob blob-teal"></div>

    <!-- Left -->
    <div class="hero-left">
      <div class="hero-eyebrow">
        <div class="hero-eyebrow-dot"></div>
        <span>Invite &nbsp;·&nbsp; Q1 FY27</span>
      </div>
      <div class="hero-headline">
        Hiring at<br><span class="teal">a Glance.</span>
      </div>
      <div class="hero-sub">
        <span class="hero-sub-line">May 1 – Jul 31, 2026 &nbsp;·&nbsp; <span id="daysRemaining">–</span> days remaining</span>
        <span class="hero-sub-line">Select a team below to open its dashboard</span>
      </div>
    </div>

    <!-- Right stats -->
    <div class="hero-stats">
      <div class="hero-stat">
        <div class="hero-stat-val" id="statAccepted" style="color:var(--teal)">–</div>
        <div class="hero-stat-lbl">Accepted</div>
      </div>
      <div class="hero-stat">
        <div class="hero-stat-val" id="statOAR" style="color:var(--coral)">–</div>
        <div class="hero-stat-lbl">Team OAR</div>
      </div>
      <div class="hero-stat">
        <div class="hero-stat-val" id="statTTH" style="color:var(--amber)">–</div>
        <div class="hero-stat-lbl">Time to Hire</div>
      </div>
    </div>
  </div>

  <!-- Divider -->
  <div class="section-divider"></div>

  <!-- Team cards -->
  <div class="team-grid">

    <a href="engineering/" class="team-card" style="--tc:#F45D48;--tca:rgba(244,93,72,.28)">
      <div class="team-card-top">
        <div class="team-name">Engineering</div>
        <div class="team-arrow">→</div>
      </div>
      <div class="team-oar" id="oarEngineering">–</div>
      <div class="team-oar-lbl">OAR</div>
      <div class="team-bar-wrap"><div class="team-bar" id="barEngineering" style="width:0%"></div></div>
      <div class="team-reqs" id="reqsEngineering">– open reqs</div>
    </a>

    <a href="gtm/" class="team-card" style="--tc:#0A8080;--tca:rgba(10,128,128,.28)">
      <div class="team-card-top">
        <div class="team-name">GTM</div>
        <div class="team-arrow">→</div>
      </div>
      <div class="team-oar" id="oarGTM">–</div>
      <div class="team-oar-lbl">OAR</div>
      <div class="team-bar-wrap"><div class="team-bar" id="barGTM" style="width:0%"></div></div>
      <div class="team-reqs" id="reqsGTM">– open reqs</div>
    </a>

    <a href="cx/" class="team-card" style="--tc:#6B55D6;--tca:rgba(107,85,214,.28)">
      <div class="team-card-top">
        <div class="team-name">CX</div>
        <div class="team-arrow">→</div>
      </div>
      <div class="team-oar" id="oarCX">–</div>
      <div class="team-oar-lbl">OAR</div>
      <div class="team-bar-wrap"><div class="team-bar" id="barCX" style="width:0%"></div></div>
      <div class="team-reqs" id="reqsCX">– open reqs</div>
    </a>

    <a href="spectech/" class="team-card" style="--tc:#D97706;--tca:rgba(217,119,6,.28)">
      <div class="team-card-top">
        <div class="team-name">SpecTech</div>
        <div class="team-arrow">→</div>
      </div>
      <div class="team-oar" id="oarSpecTech">–</div>
      <div class="team-oar-lbl">OAR</div>
      <div class="team-bar-wrap"><div class="team-bar" id="barSpecTech" style="width:0%"></div></div>
      <div class="team-reqs" id="reqsSpecTech">– open reqs</div>
    </a>

    <a href="foundation/" class="team-card" style="--tc:#10B981;--tca:rgba(16,185,129,.28)">
      <div class="team-card-top">
        <div class="team-name">Foundation</div>
        <div class="team-arrow">→</div>
      </div>
      <div class="team-oar" id="oarFoundation">–</div>
      <div class="team-oar-lbl">OAR</div>
      <div class="team-bar-wrap"><div class="team-bar" id="barFoundation" style="width:0%"></div></div>
      <div class="team-reqs" id="reqsFoundation">– open reqs</div>
    </a>

  </div>
</div><!-- end .page -->

<script>
// ── Date math ──────────────────────────────────────────────────
const today         = new Date();
const qEnd          = new Date('2026-07-31');
const daysRemaining = Math.max(0, Math.floor((qEnd - today) / 86400000));
document.getElementById('daysRemaining').textContent = daysRemaining;

// ── Engineering fallback data (updated from sheet below) ────────
const ENG = { accepted: 27, oar: 75, tth: 28, goal: 46 };

function applyFallback() {
  document.getElementById('statAccepted').textContent = ENG.accepted;
  document.getElementById('statOAR').textContent      = ENG.oar + '%';
  document.getElementById('statTTH').textContent      = '~' + ENG.tth + 'd';

  // Engineering card (only live-connected team for now)
  setCard('Engineering', ENG.oar, ENG.oar, 65);
  // Other teams show placeholder until their data is connected
  setCard('GTM',        '–', null, 0);
  setCard('CX',         '–', null, 0);
  setCard('SpecTech',   '–', null, 0);
  setCard('Foundation', '–', null, 0);
}

function setCard(team, oarDisplay, oarVal, reqs) {
  const oarEl  = document.getElementById('oar' + team);
  const barEl  = document.getElementById('bar' + team);
  const reqsEl = document.getElementById('reqs' + team);
  if (oarEl)  oarEl.textContent  = oarVal !== null ? oarDisplay + '%' : '–';
  if (barEl)  barEl.style.width  = (oarVal || 0) + '%';
  if (reqsEl) reqsEl.textContent = reqs > 0 ? reqs + ' open reqs' : '– open reqs';
}

applyFallback();

// ── Live fetch ───────────────────────────────────────────────────
const TOOL           = 'mcp__c61042c2-2fb3-4e2e-888c-dce52a6a8c86__fetch';
const PIPELINE_SHEET = '1jFTGmMfMgsnkCbPPhgwZDPtbNM0-wIM1Ee-FLvTOZVU';
const APPS_SCRIPT    = 'https://script.google.com/a/macros/gusto.com/s/AKfycbw1GDnQXS_r7ZG2zGyU8w7jjqi6GUzqfHOCzMirkb4jnbOeKQd7GUL2MizKI-soLGA/exec';

function extractContent(r) {
  if (!r || r.isError) return '';
  if (r.structuredContent?.content) return r.structuredContent.content;
  const arr = Array.isArray(r.content) ? r.content : [];
  const blk = arr.find(b => b?.type === 'text');
  if (blk?.text) { try { return JSON.parse(blk.text)?.content || blk.text; } catch { return blk.text; } }
  return '';
}

async function fetchLive() {
  if (!window.cowork || !window.cowork.callMcpTool) { appsScriptFallback(); return; }

  try {
    const r = await window.cowork.callMcpTool(TOOL, {
      spreadsheet_id: PIPELINE_SHEET,
      sheet_name: 'Offers [PLEASE DO NOT TOUCH]',
      cell_range: 'A1:Z600'
    });
    const txt = extractContent(r);
    if (!txt || txt.length < 100) return;

    const rows = txt.split('\n').map(l => l.split('\t').map(c => c.trim())).filter(r => r.some(c => c));
    if (rows.length < 2) return;

    const hdr        = rows[0].map(h => h.toLowerCase());
    const stageIdx   = hdr.findIndex(h => h.includes('stage') || h.includes('status'));
    const resolvedIdx= hdr.findIndex(h => h.includes('resolved') || h.includes('acceptance'));
    const startIdx   = hdr.findIndex(h => h.includes('start'));

    const Q1S = new Date('2026-05-01'), Q1E = new Date('2026-07-31');
    let accepted = 0, extended = 0, tthDays = 0, tthN = 0;

    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      if (!row || row.length < 2) continue;
      const stage = stageIdx >= 0 ? (row[stageIdx]||'').toLowerCase() : '';
      const resDate = resolvedIdx >= 0 ? new Date(row[resolvedIdx]) : null;
      if (!resDate || isNaN(resDate) || resDate < Q1S || resDate > Q1E) continue;

      extended++;
      if (stage.includes('accept')) {
        accepted++;
        const startDate = startIdx >= 0 ? new Date(row[startIdx]) : null;
        if (startDate && !isNaN(startDate)) {
          const diff = Math.floor((startDate - resDate) / 86400000);
          if (diff > 0 && diff < 200) { tthDays += diff; tthN++; }
        }
      }
    }

    if (accepted > 0 || extended > 0) {
      const oar = extended > 0 ? Math.round(accepted / extended * 100) : ENG.oar;
      const tth = tthN > 0 ? Math.round(tthDays / tthN) : ENG.tth;
      document.getElementById('statAccepted').textContent = accepted;
      document.getElementById('statOAR').textContent      = oar + '%';
      document.getElementById('statTTH').textContent      = tth + 'd';
      setCard('Engineering', oar, oar, null);
    }
  } catch(e) { console.warn('[Landing] fetch error:', e); }

  // Open HC reqs count
  try {
    const r2 = await window.cowork.callMcpTool(TOOL, {
      spreadsheet_id: PIPELINE_SHEET,
      sheet_name: 'Open HC [PLEASE DO NOT TOUCH]',
      cell_range: 'A1:Z300'
    });
    const txt2 = extractContent(r2);
    if (txt2 && txt2.length > 50) {
      const rows2 = txt2.split('\n').filter(l => l.trim()).length - 1;
      document.getElementById('reqsEngineering').textContent = Math.max(0, rows2) + ' open reqs';
    }
  } catch(e) {}
}

function appsScriptFallback() {
  const cb = '_lcb' + Date.now();
  window[cb] = function(d) {
    delete window[cb];
    const s = document.getElementById('_ls'); if (s) s.remove();
    try {
      if (!d || !d.rows) return;
      const Q1S = new Date('2026-05-01'), Q1E = new Date('2026-07-31');
      let acc = 0, ext = 0;
      d.rows.forEach(row => {
        const stage = (row.stage || row.status || '').toLowerCase();
        const dt = new Date(row.resolved || row.acceptance_date || '');
        if (!isNaN(dt) && dt >= Q1S && dt <= Q1E) {
          ext++;
          if (stage.includes('accept')) acc++;
        }
      });
      if (acc > 0) {
        document.getElementById('statAccepted').textContent = acc;
        const oar = ext > 0 ? Math.round(acc / ext * 100) : ENG.oar;
        document.getElementById('statOAR').textContent = oar + '%';
        setCard('Engineering', oar, oar, null);
      }
    } catch(e) {}
  };
  const s = document.createElement('script');
  s.id = '_ls';
  s.src = APPS_SCRIPT + '?callback=' + cb + '&sheet=Offers%20%5BPLEASE%20DO%20NOT%20TOUCH%5D';
  document.head.appendChild(s);
  setTimeout(() => { delete window[cb]; const s = document.getElementById('_ls'); if(s) s.remove(); }, 12000);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', fetchLive);
} else {
  fetchLive();
}

// ── Card throw animation ────────────────────────────────────────────────
(function () {
  var busy = false;

  function launchCard(card, url) {
    if (busy) return;
    busy = true;

    var ov   = document.getElementById('card-throw-ov');
    var face = document.getElementById('card-throw-face');
    var tc   = card.style.getPropertyValue('--tc').trim();

    // Clone card contents into overlay face
    face.innerHTML = card.innerHTML;
    face.style.cssText = [
      'position:absolute', 'inset:0', 'display:flex', 'flex-direction:column',
      'padding:18px 16px 16px', 'border-radius:inherit',
      'background:color-mix(in srgb,' + tc + ' 7%,#F8F5F2)',
      'border:1.5px solid ' + tc
    ].join(';');
    face.style.setProperty('--tc', tc);

    // Measure card position in viewport
    var cr   = card.getBoundingClientRect();
    var tx   = window.innerWidth  / 2 - (cr.left + cr.width  / 2);
    var ty   = window.innerHeight / 2 - (cr.top  + cr.height / 2);
    var P    = 'perspective(1100px)';
    var base = P + ' translate(' + tx + 'px,' + ty + 'px)';

    ov.style.cssText = [
      'display:block', 'position:fixed',
      'left:'   + Math.round(cr.left)   + 'px',
      'top:'    + Math.round(cr.top)    + 'px',
      'width:'  + Math.round(cr.width)  + 'px',
      'height:' + Math.round(cr.height) + 'px',
      'border-radius:16px', 'overflow:hidden',
      'z-index:9999', 'pointer-events:none',
      'will-change:transform', 'transition:none',
      'transform:' + base + ' scale(1) rotateY(0deg) rotateZ(0deg)'
    ].join(';');

    card.style.visibility = 'hidden';

    // Phase 1 — Wind-up (0 → 380 ms)
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      ov.style.transition = 'transform 380ms cubic-bezier(0.0,0.0,0.4,1.0)';
      ov.style.transform  = base + ' scale(1.8) rotateY(-22deg) rotateZ(-4deg)';
    }); });

    // Phase 2 — Throw to edge-on (380 → 880 ms)
    setTimeout(function () {
      ov.style.transition = 'transform 500ms cubic-bezier(0.55,0,1,1)';
      ov.style.transform  = base + ' scale(3.4) rotateY(90deg) rotateZ(1deg)';
    }, 380);

    // Navigate at edge-on — card is invisible, seamless handoff to team page
    setTimeout(function () {
      window.location.href = url;
    }, 880);
  }

  // Wire all team cards
  document.querySelectorAll('.team-card').forEach(function (card) {
    card.addEventListener('click', function (e) {
      e.preventDefault();
      launchCard(this, this.getAttribute('href'));
    });
  });
}());
</script>

<!-- Card throw animation overlay -->
<div id="card-throw-ov">
  <div id="card-throw-face"></div>
</div>

</body>
</html>
